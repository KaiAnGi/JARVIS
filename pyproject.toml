[project]
name = "jarvis-voice-assistant"
version = "1.0.0"
description = "J.A.R.V.I.S. — Just A Rather Very Intelligent System"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (load_env() must run first)
    "B008",   # function call in default argument (PyQt pattern)
    "SIM105", # contextlib.suppress (readability preference)
    "SIM103", # return condition directly (readability preference)
    "RUF013", # implicit Optional (changing would alter public API)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "plugins", "gui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
exclude = [
    "tests/",
    ".venv/",
    "models/",
    "assets/",
    "data/",
]

[[tool.mypy.overrides]]
module = [
    "vosk.*",
    "pyaudio.*",
    "pyautogui.*",
    "pygetwindow.*",
    "pystray.*",
    "git.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "noisereduce.*",
    "numpy.*",
    "pyperclip.*",
    "openwakeword.*",
    "PyQt6.*",
    "PyQt6.QtCore.*",
    "PyQt6.QtGui.*",
    "PyQt6.QtWidgets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "gui.*",
    "pystray.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["core", "plugins"]
omit = [
    "tests/*",
    "gui/*",
    "main.py",
    "app.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
skip_covered = true
fail_under = 0
