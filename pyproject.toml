[project]
name = "jarvis-voice-assistant"
version = "1.0.0"
description = "J.A.R.V.I.S. — Just A Rather Very Intelligent System"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

dependencies = [
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "noisereduce>=3.0",
]

[project.optional-dependencies]
audio = [
    "vosk==0.3.45",
    "pyaudio==0.2.14",
    "openwakeword==0.6.0",
]
gui = [
    "PyQt6==6.11.0",
    "pystray==0.19.5",
    "Pillow==12.3.0",
]
win = [
    "pywin32==312",
    "pygetwindow==0.0.9",
    "pyautogui==0.9.54",
]
plugins = [
    "gitpython==3.1.56",
    "google-api-python-client==2.198.0",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",
    "pyperclip==1.11.0",
]
all = [
    "jarvis-voice-assistant[audio,gui,win,plugins]",
]
test = [
    "jarvis-voice-assistant[plugins]",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (load_env() must run first)
    "B008",   # function call in default argument (PyQt pattern)
    "SIM105", # contextlib.suppress (readability preference)
    "SIM103", # return condition directly (readability preference)
    "RUF013", # implicit Optional (changing would alter public API)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "plugins", "gui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
exclude = [
    "tests/",
    ".venv/",
    "models/",
    "assets/",
    "data/",
]

[[tool.mypy.overrides]]
module = [
    "vosk.*",
    "pyaudio.*",
    "pyautogui.*",
    "pygetwindow.*",
    "git.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "noisereduce.*",
    "numpy.*",
    "pyperclip.*",
    "openwakeword.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["core", "plugins"]
omit = [
    "tests/*",
    "gui/*",
    "main.py",
    "app.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
skip_covered = true
fail_under = 0

[tool.setuptools.packages.find]
include = ["core*", "plugins*"]
exclude = ["tests*", "gui*", "data*", "assets*", "config*", "models*"]
